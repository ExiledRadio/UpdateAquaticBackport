# Gradle Specifications
org.gradle.jvmargs=-Xms256M -Xmx2G
org.gradle.daemon=false

# General Specifications
mc_version=1.12.2
mod_version=1.0.0
# DO NOT RAISE THIS. 14.23.5.2847 is the last 1.12.2 Forge build that publishes a
# `-userdev.jar` artifact. Builds 2848+ publish only `-userdev3.jar`, which is the
# ForgeGradle 3 format that the ForgeGradle 2.3 fork used here cannot consume - the
# download 404s and the build fails. This is a toolchain ceiling, not a bug.
# It does not limit what players can run: 1.12.2 Forge is binary-compatible across
# these builds, so a mod compiled against 2847 runs fine on 2860.
forge_version=14.23.5.2847
mod_group=com.exiledradio
# Permanent from the first release: it is the config file name, the domain of every block, item and
# entity this mod registers, and so a key in every world that uses it. The display name can change.
mod_id=updateaquaticbackport
mod_name=Update Aquatic Backport
mod_archives_name=UpdateAquaticBackport
mod_author=ExiledRadio
mod_description=Brings Minecraft 1.13's Update Aquatic to 1.12.2: kelp, seagrass, coral reefs, sea pickles, turtles, dolphins, fish, phantoms, the trident and the drowned, conduits, shipwrecks, ocean ruins and buried treasure. Every part can be switched off on its own.
mod_credits=By ExiledRadio. Not affiliated with Mojang.
mod_url=https://github.com/ExiledRadio/UpdateAquaticBackport

# Dev-only: set `uabDeployDir` in ~/.gradle/gradle.properties to auto-copy the
# built jar into a test instance's mods folder.
core_version=1.3.0
